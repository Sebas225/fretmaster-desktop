name: Release Desktop

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows Installer (.exe NSIS & Portable)
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows Installers
        uses: actions/upload-artifact@v4
        with:
          name: FretMaster-Windows-Installers
          path: |
            dist/*.exe

  build-macos:
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build macOS Universal Installer (.dmg & .zip)
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS Installers
        uses: actions/upload-artifact@v4
        with:
          name: FretMaster-macOS-Installers
          path: |
            dist/*.dmg
            dist/*.zip
